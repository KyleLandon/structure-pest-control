<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found | Structure Pest Control</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/mark.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem; }
    .nf__code { font-family: var(--font-display); font-weight: 700; font-size: clamp(5rem, 18vw, 10rem); line-height: 1; color: transparent; -webkit-text-stroke: 2px var(--green-400); }
    .nf h1 { color: #fff; font-size: clamp(1.6rem, 3vw, 2.2rem); margin: 0.5rem 0 1rem; }
    .nf p { color: rgba(255,255,255,0.7); max-width: 44ch; margin: 0 auto 2rem; }
    .nf__actions { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body class="hero" style="margin:0; padding:0;">
  <main class="nf">
    <div>
      <div class="nf__code" aria-hidden="true">404</div>
      <h1>That page got away from us.</h1>
      <p>The link you followed may be old or mistyped. Head back home or give us a call and we'll point you in the right direction.</p>
      <div class="nf__actions">
        <a class="btn btn--accent" href="/">Back to home</a>
        <a class="btn btn--outline-light" href="tel:+18305550123">(830) 555-0123</a>
      </div>
    </div>
  </main>
</body>
